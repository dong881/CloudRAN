---
{{- if .Values.multus.f1Interface.create }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition 
metadata:
  name: {{ .Release.Name }}-f1
  labels:
    app: oai-du
spec:
  config: '{ 
      "cniVersion": "0.3.1",
      "name": "{{ .Release.Name }}-f1",
      "plugins": [
        {
        "type": "macvlan",
        "master": {{- cat .Values.multus.f1Interface.hostInterface | nospace | quote }},
        "mode": "bridge",
        "ipam": {
          "type": "static",
          "addresses": [
                  {
                          "address": {{- cat .Values.multus.f1Interface.IPadd "/" .Values.multus.f1Interface.Netmask | nospace | quote }}
                          {{- if .Values.multus.f1Interface.Gateway }}
                          ,"gateway": {{- cat .Values.multus.f1Interface.Gateway | nospace | quote }}
                          {{- end }}
                  }
          ]
          {{- if .Values.multus.f1Interface.routes }}
          ,"routes":  {{- .Values.multus.f1Interface.routes | toJson }}
          {{- end }}
        }
      }
    ]
    }'
{{- end }}
{{- if .Values.multus.ruInterface.create }}
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Chart.Name }}-ru-cplane
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/{{ .Values.multus.ruInterface.sriovResourceNameCplane }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": {{ .Values.multus.ruInterface.vlan }},
      "spoofchk": "off",
      "trust": "on"
    }'
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Chart.Name }}-ru-uplane
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/{{ .Values.multus.ruInterface.sriovResourceNameUplane }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": {{ .Values.multus.ruInterface.vlan }},
      "spoofchk": "off",
      "trust": "on"
    }'
{{- end }}

