kubernetesDistribution: Vanilla  #Vanilla for community kubernetes distribution else Openshift for Openshift

## In case of using these charts on Openshift then please use UBI images
## To know more about them follow this tutorial https://gitlab.eurecom.fr/oai/cn5g/oai-cn5g-fed/-/tree/master/openshift
nfimage:
  repository: docker.io/oaisoftwarealliance/oai-nr-ue           # dockehub oaisoftwarealliance/oai-nr-ue
  # Must track the same branch/tag as oai-gnb's nfimage.version (../oai-gnb/values.yaml) --
  # the RFsim wire protocol and PHY params are not guaranteed stable across OAI releases,
  # and a 2024.w32 UE against a develop gNB fails cell sync (observed 2026-07-27).
  version: develop # image tag or develop
  # pullPolicy: IfNotPresent or Never or Always
  pullPolicy: Always

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "oai-nr-ue-sa"

# good to use when pulling images from docker-hub mention 
imagePullSecrets: 
 - name: "regcred"

config:
  timeZone: "Europe/Paris"
  rfSimServer: "oai-ran"    # ip-address of rfsim or service name oai-gnb or oai-du
  # 001010000000100 was added to the local Open5GS (192.168.8.26, MongoDB) via
  # `open5gs-dbctl add_ue_with_apn` on 2026-07-27: sst=1, no sd, apn/dnn=oai --
  # the chart's original default IMSI did not exist in the DB before that (confirmed
  # via open5gs-dbctl showall) and the AMF rejected registration with PLMN_not_allowed.
  #
  # NOTE on sd: nr-uesoftmodem's legacy uicc0 PDU-session path (the one this chart's
  # configmap.yaml uses) ALWAYS requests the PDU session with SD absent regardless of
  # nssai_sd's value -- confirmed by testing sd unset, "16777215" (decimal), and "010203"
  # (raw hex string): all three produced "NSSAI 1.ffffff" in the PDU session request log.
  # nssai_sd only affects the Registration Request, not the PDU Session Request. So the
  # subscriber's slice (and oai-gnb's snssaiList) must have NO sd, matching what oai-vnf/
  # oai-pnf already do -- see oai-gnb/values.yaml.
  fullImsi: "001010000000100"
  fullKey: "8baf473f2f8fd09487cccbd7097c6862"
  opc: "8e27b6af0e692e750f32667a3b14605d"
  dnn: "oai"
  sst: "1"                     # configure according to gnb and amf, smf and upf
  sd: "16777215"  # decimal 0xffffff = "no SD" sentinel; ignored by the PDU session request path (see note above)
  usrp: "rfsim"            # allowed rfsim, b2xx, n3xx, x3xx
  # -C must match the gNB's absoluteFrequencySSB in ../oai-gnb/config.yaml (3319.68 MHz, band n78, 106 PRB, numerology 1)
  # NOTE: "--sa" is rejected as an unknown option by current develop-tag nr-uesoftmodem builds
  # (SA mode is implied/config-driven now, not a CLI flag) -- observed 2026-07-27 with nfimage.version=develop.
  useAdditionalOptions: "-E --rfsim -r 106 --numerology 1 -C 3319680000 --log_config.global_log_options level,nocolor,time"

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0

securityContext:
 capabilities:
    add:
     - NET_ADMIN
     - NET_RAW
     - SYS_NICE
    drop:
     - ALL
start:
  nrue: true
  tcpdump: false  # if false then started in sleep mode else it will start capturing packets, nr ue will have a lot of packets per sec better avoid this or add a filter in the deployment.yaml

includeTcpDumpContainer: false #If true it will add a tcpdump container inside network function pod for debugging

tcpdumpimage:
  repository: docker.io/oaisoftwarealliance/oai-tcpdump-init
  version: alpine-3.20
  #pullPolicy: IfNotPresent or Never or Always
  pullPolicy: IfNotPresent

## NF is the network function and tcpdump is the tcpdump container. 
## To know more about request and limit it is better to understand that how Kubernetes QoS works. 
## https://kubernetes.io/docs/concepts/configuration/manage-resources-containers
## https://kubernetes.io/docs/concepts/workloads/pods/pod-qos
resources:
  define: false
  limits:
    nf:
      cpu: 1500m
      memory: 1Gi
    #If tcpdump container is disabled this value will not be used
    tcpdump:
      cpu: 200m
      memory: 128Mi
  requests:
    nf:
      cpu: 1500m
      memory: 1Gi
    #If tcpdump container is disabled this value will not be used
    tcpdump:
      cpu: 100m
      memory: 128Mi

terminationGracePeriodSeconds: 0

nodeSelector: {}

nodeName:
